[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-recruiter-matching"
version = "0.1.0"
description = "Nền tảng matching ứng viên và nhân viên tuyển dụng"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "qdrant-client>=1.12,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
embeddings = [
    "numpy>=1.26,<3.0",
  "torch>=2.6,<3.0",
    "transformers>=4.44,<5.0",
]
sentence-transformers = [
    "numpy>=1.26,<3.0",
    "pillow>=10.0,<12.0",
    "sentence-transformers>=3.0,<4.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
