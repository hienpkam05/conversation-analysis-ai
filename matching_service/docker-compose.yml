services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recruitment_ai
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_dev_password
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_HOST_PORT:-6335}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6336}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: ${INSTALL_EMBEDDINGS:-false}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitment_user:recruitment_dev_password@postgres:5432/recruitment_ai
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8001:8001"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
